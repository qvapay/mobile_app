# Activo TRON sin cuenta: con actividad (historial público desde 2026-10-01; contra un qpweb
# anterior sale la invitación a crear cuenta), con swap (wallet ↔ wallet sin cuenta desde
# 2026-10-15) y sin energía. El explorador solo ocupa el hueco cuando NO hay swap
appId: com.qvapay
env:
  PIN: "1234"
---
- runFlow:
    file: subflows/scroll_up_to.yaml
    env:
      TARGET: "wallet-asset-tron:native"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "wallet-asset-tron:native"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "asset-action-send"
    timeout: 10000
- assertVisible:
    id: "asset-action-send"
- assertVisible:
    id: "asset-action-receive"
# Swap depende del catálogo del agregador, que llega después: hasta entonces se ve el explorador
- extendedWaitUntil:
    visible:
      id: "asset-action-swap"
    timeout: 15000
- assertNotVisible:
    id: "asset-action-explorer"
- assertNotVisible:
    id: "asset-action-energy"
- takeScreenshot: 02_asset_tron
- runFlow: subflows/header_back.yaml
- extendedWaitUntil:
    visible:
      id: "wallet-only"
    timeout: 5000
