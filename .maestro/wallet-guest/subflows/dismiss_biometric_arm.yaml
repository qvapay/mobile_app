appId: com.qvapay
---
# Android: si tras un PIN sale un diálogo de huella, se cancela. Hasta la 3.5.13
# armar el marcador (react-native-keychain) pedía la huella al escribirlo; con
# BiometricGate (3.5.14) armar ya no la pide, pero el diálogo que se abre solo en
# el bloqueo o en el modal de la wallet se cancela igual (cancel_biometric_prompt).
# El id es regex: el diálogo es de systemui en AOSP pero de su propio paquete en
# Samsung (com.samsung.android.biometrics.app.setting) y otras capas
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible:
              id: ".*:id/button_negative"
          commands:
            - tapOn:
                id: ".*:id/button_negative"
