appId: com.qvapay
---
# Android: tras un PIN correcto la app arma el marcador biométrico, y guardar
# un secreto con biometría en Android PIDE la huella al escribirlo (iOS no).
# En E2E se cancela: el marcador queda sin armar y el PIN sigue siendo el gate.
# El id es regex: el diálogo es de systemui en AOSP pero de su propio paquete en
# Samsung (com.samsung.android.biometrics.app.setting) y otras capas
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible:
              id: ".*:id/button_negative"
          commands:
            - tapOn:
                id: ".*:id/button_negative"
