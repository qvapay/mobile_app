# Responde el quiz de backup (una rama por posición; si las posiciones salen
# ascendentes, una pasada responde en cascada y el repeat del caller es respaldo)
appId: com.qvapay
---
- runFlow:
    when:
      visible:
        id: "wallet-quiz-position-1"
    commands:
      - tapOn:
          id: "wallet-quiz-option-${output.w1}"
- runFlow:
    when:
      visible:
        id: "wallet-quiz-position-2"
    commands:
      - tapOn:
          id: "wallet-quiz-option-${output.w2}"
