# Arranque en frío con wallet y sin sesión: bloqueo con PIN → modo wallet
appId: com.qvapay
env:
  PIN: "1234"
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "lock-screen"
    timeout: 20000
# El bloqueo es un Modal que entra con fundido mientras el JS aún arranca: esperar a que
# termine antes de tocar las teclas
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05_lock
- runFlow: subflows/tap_lock_pin.yaml
- extendedWaitUntil:
    visible:
      id: "wallet-only"
    timeout: 10000
