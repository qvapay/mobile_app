# Arranque en frío con wallet y sin sesión: bloqueo con PIN → modo wallet
appId: com.qvapay
env:
  PIN: "1234"
---
- runFlow: subflows/cold_lock.yaml
- takeScreenshot: 05_lock
- runFlow: subflows/tap_lock_pin.yaml
# En dev, recién arrancada en frío, comprobar el PIN puede tardar varios segundos
- extendedWaitUntil:
    visible:
      id: "wallet-only"
    timeout: 30000
