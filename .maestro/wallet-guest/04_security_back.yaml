# Seguridad abre el panel de la wallet como raíz de Ajustes (sin el menú de la
# cuenta) y su "volver" propio regresa al modo wallet
appId: com.qvapay
---
- runFlow:
    file: subflows/scroll_down_to.yaml
    env:
      TARGET: "wallet-home-security"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "wallet-home-security"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "wallet-settings-back"
    timeout: 5000
# En pantallas más bajas (Android) el botón queda bajo el pliegue
- runFlow:
    file: subflows/scroll_down_to.yaml
    env:
      TARGET: "wallet-settings-delete"
- takeScreenshot: 04_security
- runFlow: subflows/settings_back.yaml
- extendedWaitUntil:
    visible:
      id: "wallet-only"
    timeout: 5000
